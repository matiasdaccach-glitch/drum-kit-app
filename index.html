<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini Drum Kit</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <h1>🥁 Mini Drum Kit</h1>
    <p>Haz clic en un pad o usa las teclas A S D J K L.</p>

    <section class="pads">
      <button class="pad" data-key="a" data-sound="kick">A<span>Bombo</span></button>
      <button class="pad" data-key="s" data-sound="snare">S<span>Caja</span></button>
      <button class="pad" data-key="d" data-sound="hat">D<span>Platillo</span></button>
      <button class="pad" data-key="j" data-sound="tom">J<span>Tom</span></button>
      <button class="pad" data-key="k" data-sound="clap">K<span>Palma</span></button>
      <button class="pad" data-key="l" data-sound="ride">L<span>Ride</span></button>
    </section>
  </main>
</body>
</html>
