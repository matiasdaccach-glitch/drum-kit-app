<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drum Kit</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <h1>🥁 Mi batería virtual</h1>
    <p>Haz clic en un botón o usa las teclas A, S, D, J, K y L.</p>

    <section class="pads">
      <button class="pad" data-key="a" data-sound="kick">
        A <span>Kick</span>
      </button>

      <button class="pad" data-key="s" data-sound="clap">
        S <span>Clap</span>
      </button>

      <button class="pad" data-key="d" data-sound="hihat">
        D <span>Hi-hat</span>
      </button>

      <button class="pad" data-key="j" data-sound="boom">
        J <span>Boom</span>
      </button>

      <button class="pad" data-key="k" data-sound="openhat">
        K <span>Open hat</span>
      </button>

      <button class="pad" data-key="l" data-sound="ride">
        L <span>Ride</span>
      </button>
    </section>
  </main>
</body>
</html>
